# color scheme: Gruvbox
[colors]
  [colors.primary]
    background = "#282828"
    foreground = "#ebdbb2"

  [colors.normal]
    black   = "#1d2021"
    red     = "#fb4934"
    green   = "#b8bb26"
    yellow  = "#fabd2f"
    blue    = "#83a598"
    white   = "#fbf1c7"

  [colors.bright]
    black   = "#665c54"
    red     = "#cc241d"
    green   = "#98971a"
    yellow  = "#d79921"
    blue    = "#458588"
    white   = "#a89984"

  [colors.cursor]
    text = "#282828"
    cursor = "#ebdbb2"

  [colors.selection]
    background = "#7c6f64"
    foreground = "#fbf1c7"

[env]
TERM = "xterm-256color"

[font]
size = 9

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Control|Shift"
