$font = Monospace

general {
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/Pictures/screenlock
    blur_passes = 0
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(143, 143, 143)
    check_color = rgba(143, 143, 143)
    fail_color =  rgba(143, 143, 143)

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    # dots_size = 0.4
    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}
